// Preset A: physically consistent light, low-key (suspense) camera. Run once: exec light_honest.cfg
// Light quantities are not fudged: baked bounce light at full strength, AO only on it.
// Mood comes only from the "camera": low-key exposure and slow dark adaptation.
seta r_ssao 0
seta r_useLightGrid 1
seta r_forceAmbient 0
seta r_lightGridIntensity 1
seta r_lightGridIrradianceGamma 1
// eye adaptation (needs the openQ4 Light build: r_hdrAutoExposureClassic)
seta r_hdrToneMap 1
seta r_hdrAutoExposure 1
seta r_hdrAutoExposureClassic 1
seta r_hdrKeyValue 0.09
seta r_hdrMinExposure 0.5
seta r_hdrMaxExposure 1.5
seta r_hdrAdaptUpSpeed 0.3
seta r_hdrAdaptDownSpeed 3
echo "light_honest.cfg applied"
