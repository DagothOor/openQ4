// openQ4 Light: GTAO on the whole frame, no eye adaptation (cheaper). Run once: exec light_classic.cfg
seta r_useLightGrid 1
seta r_forceAmbient 0
seta r_lightGridAO 0
seta r_ssao 1
seta r_ssaoGTAO 1
seta r_ssaoIntensity 1
seta r_ssaoPower 1
seta r_ssaoMaxDistance 4096
seta r_lightGridIntensity 1
seta r_lightGridIrradianceGamma 1
seta r_lightGridShadowFloor 0.04
seta r_hdrToneMap 0
seta r_hdrAutoExposure 0
echo "light_classic.cfg applied"
