// openQ4 Light: physically based light. Run once: exec light_physical.cfg
seta r_useLightGrid 1
seta r_forceAmbient 0
seta r_lightGridAO 1
seta r_ssao 1
seta r_ssaoGTAO 1
seta r_lightGridIntensity 1
seta r_lightGridIrradianceGamma 1
seta r_lightGridShadowFloor 0.04
seta r_hdrToneMap 1
seta r_hdrAutoExposure 1
seta r_hdrAutoExposureClassic 1
seta r_hdrKeyValue 0.058
seta r_hdrMinExposure 0.6
seta r_hdrMaxExposure 1.6
seta r_hdrAdaptUpSpeed 0.3
seta r_hdrAdaptDownSpeed 3
echo "light_physical.cfg applied"
